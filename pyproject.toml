[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-photo-bot"
version = "0.1.0"
description = "A Discord photo importer for Reddit and direct image sources"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "discord.py>=2.5,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
pico-photo-bot = "pico_photo_bot.main:main"
pico-photo-bot-auth = "pico_photo_bot.auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
